# Dokploy deployment that builds the Aegisbox apps from source, so no container
# registry (GHCR) or registry login is needed. Two images are built: aegisbox
# (migrations + manager API + SMPP gateway) and portal. Same ports as docker-compose.yml.
# Monitoring (Grafana, Prometheus, Loki, Promtail, Alertmanager) is left out for now; their
# configs are still in this repo, and docker-compose.yml still runs them.
#
# The app source is copied into src/ (from thrillee/aegisbox and thrillee/aegisbox-portal),
# so Dokploy only needs this repository: compose path ./docker-compose.dokploy.yml, no
# submodules. To deploy newer app code, run scripts/sync-sources.sh and push (see README).

services:
  # Backend: one image and one container. On start it runs pending migrations,
  # then the manager API and the SMPP gateway (thrillee/aegisbox, cmd/aegisbox).
  aegisbox:
    build:
      context: ./src/aegisbox
      dockerfile: deploy/aegisbox/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # Listen addresses must match the container ports mapped below. Values set in
    # .env (Dokploy's Environment tab) win; these are only the fallbacks.
    environment:
      API_ADDR: ${API_ADDR:-:8001}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0:6886}
      HTTP_CONFIG_ADDR: ${HTTP_CONFIG_ADDR:-0.0.0.0:8000}
      API_DLR_ADDR: ${API_DLR_ADDR:-9001}
    ports:
      - "${API_PORT:-8001}:8001"
      - "${SMPP_PORT:-6886}:6886"
      - "${SP_API_ADDR:-8000}:8000"
      - "${MNO_DLR_ADDR:-9001}:9001"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "aegisbox"
    # Link scan screenshots (private; kept 7 days by default)
    volumes:
      - linkscan-data:/data/linkscans
    networks:
      aegisbox-network:
        # Old service names, so the portal (PORTAL_API_URL) and Prometheus targets keep working
        aliases:
          - manager-api
          - smpp-gateway
      # Only to call the linkscanner service
      linkscan-network: {}

  # Simulated MNO for test traffic (aegisbox mnosim): accepts SMPP binds and submits like an upstream
  # and sends delivery receipts, without sending anything. Internal only: no published port. Add it
  # in the portal as an MNO marked as simulator, with an SMPP connection to host mnosim, port 2776;
  # the gateway only lets customers marked as test use it.
  # Simpler alternative: set MNOSIM_ENABLED=true (and MNOSIM_PASSWORD) in the Environment tab and
  # the aegisbox container runs the simulator itself on 127.0.0.1:2776; register the connection
  # as host 127.0.0.1, port 2776. Use one or the other, not both.
  mnosim:
    build:
      context: ./src/aegisbox
      dockerfile: deploy/aegisbox/Dockerfile
    command: ["mnosim"]
    restart: unless-stopped
    environment:
      MNOSIM_ADDR: ":2776"
      MNOSIM_SYSTEM_ID: ${MNOSIM_SYSTEM_ID:-simulator}
      MNOSIM_PASSWORD: ${MNOSIM_PASSWORD:-change_me}
      MNOSIM_DLR_DELAY_MIN: ${MNOSIM_DLR_DELAY_MIN:-2s}
      MNOSIM_DLR_DELAY_MAX: ${MNOSIM_DLR_DELAY_MAX:-10s}
      MNOSIM_DLR_MIX: ${MNOSIM_DLR_MIX:-DELIVRD:90,UNDELIV:5,EXPIRED:2,NONE:3}
      MNOSIM_REJECT_PERCENT: ${MNOSIM_REJECT_PERCENT:-0}
      MNOSIM_NO_RESPONSE_PERCENT: ${MNOSIM_NO_RESPONSE_PERCENT:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "mnosim"
    networks:
      - aegisbox-network

  # Link scanner: opens links from simulator traffic in a locked-down Chromium and reports what the
  # pages do. No database access and no published port. It sits alone on linkscan-network (internet
  # access only); the backend joins that network just to call it. Its own SSRF guard keeps pages
  # away from private addresses, the server and the database. See docs/LINK_SCANNING_ENABLE.md.
  linkscanner:
    build:
      context: ./src/aegisbox/linkscanner
    restart: unless-stopped
    environment:
      # Without a token the scanner stays idle (no browser started). Same value as for aegisbox.
      LINKSCAN_TOKEN: ${LINKSCAN_TOKEN:-}
      LINKSCAN_MAX_CONCURRENCY: ${LINKSCAN_MAX_CONCURRENCY:-2}
      # The server's own public IP(s) and any other addresses pages must never reach
      LINKSCAN_BLOCK_IPS: ${LINKSCAN_BLOCK_IPS:-}
      # Host names to block, for example the database host (aegisbox also sends the database host)
      LINKSCAN_BLOCK_HOSTS: ${LINKSCAN_BLOCK_HOSTS:-}
      LINKSCAN_TIMEOUT_MS: ${LINKSCAN_TIMEOUT_MS:-20000}
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Docker's default profile plus the calls Chromium's sandbox needs; keeps the sandbox on
      # without extra capabilities
      - seccomp=./src/aegisbox/linkscanner/seccomp-chromium.json
    mem_limit: ${LINKSCAN_MEMORY:-2g}
    cpus: ${LINKSCAN_CPUS:-1.5}
    pids_limit: 512
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "linkscanner"
    networks:
      - linkscan-network

  portal:
    build:
      context: ./src/aegisbox-portal
      args:
        # Inlined into the browser bundle at build time, so it must be a build argument
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CLERK_ADMIN_ORG_ID: ${NEXT_PUBLIC_CLERK_ADMIN_ORG_ID:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The portal reads MANAGER_API_URL (not PORTAL_API_URL); fallback is the internal service name
      MANAGER_API_URL: ${MANAGER_API_URL:-http://manager-api:8001}
    ports:
      - "${PORTAL_PORT:-3000}:3000"
    depends_on:
      - aegisbox
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "portal"
    networks:
      - aegisbox-network

networks:
  aegisbox-network:
    driver: bridge
  linkscan-network:
    driver: bridge

volumes:
  linkscan-data:
